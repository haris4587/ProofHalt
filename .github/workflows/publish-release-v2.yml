name: Publish verified ProofHalt release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish verified release tree
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part00 .bootstrap/part01 .bootstrap/part02 .bootstrap/part03 .bootstrap/fix040 .bootstrap/fix041 .bootstrap/part05 .bootstrap/part06 .bootstrap/part07 .bootstrap/fix080 .bootstrap/fix081 .bootstrap/part09 > /tmp/release.b64
          base64 -d /tmp/release.b64 > /tmp/release.tar.gz
          echo "3c5015683687b0bd268073e3c13eecf13a637cd4438750bff2b8e3c5455cb11e  /tmp/release.tar.gz" | sha256sum -c -
          tar -xzf /tmp/release.tar.gz
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-release.yml .github/workflows/publish-release-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: publish complete ProofHalt release"
          git push origin HEAD:main
